# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review settings. The rules below restate CONTRIBUTING.md and
# docs/design.md so that reviews check what this project cares about.
language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  # Finish a review even if the PR is merged first; an aborted review leaves
  # the CodeRabbit status pending forever (#31).
  abort_on_close: false
  auto_review:
    enabled: true
    drafts: false
    # Release PRs only move the CHANGELOG section and version numbers.
    ignore_title_keywords:
      - "chore: release"
  path_filters:
    - "!cmd/vnsalary/testdata/**" # CLI output snapshots, regenerated by `make golden`
  path_instructions:
    - path: "**/*.go"
      instructions: |
        - Money is `VND` (int64 đồng). Flag any float in a calculation.
        - Rounding is half-up through `roundDiv`, per insurance item and per
          tax bracket (docs/design.md §6). Flag other rounding.
        - Amounts are bounded by `MaxGross` so int64 cannot overflow; check
          new multiplications and sums against that bound.
        - Standard library only; no new dependencies.
        - Exported identifiers have English godoc. Errors are sentinel
          variables in errors.go, usable with `errors.Is`.
        - Warnings never change amounts.
    - path: "policies.go"
      instructions: |
        - Every statutory number needs a line in `Ref.Sources` naming the
          document and article (in Vietnamese). Flag numbers without one.
        - Only issued documents become policies, never drafts.
        - Policies are sorted newest first. Deductions and brackets must not
          change within a tax year (`Annual` uses the policy of 1 January).
    - path: "testdata/*.json"
      instructions: |
        - Every case needs `source` and `verified_at`.
        - Expected values must come from an external calculator, the legal
          text or an independent calculation, never from vnsalary's own
          output. `source` must say which, and say so when a case is not yet
          checked against an external tool.
    - path: "**/*_test.go"
      instructions: |
        Expected amounts in tests must be derivable by hand or from a cited
        rule; flag values that look copied from the code under test.
    - path: "{README.md,README.vi.md,docs/design.md,CHANGELOG.md}"
      instructions: |
        - Legal claims cite a document and article.
        - README.md and README.vi.md must say the same thing.
        - A CHANGELOG entry is marked "(results change)" only when the same
          inputs now give different amounts (a law change or a fix). New
          options or functions whose zero value keeps earlier results are
          not marked.
  tools:
    golangci-lint:
      enabled: true
  pre_merge_checks:
    docstrings:
      mode: "off" # godoc on exported identifiers is checked by review, not a coverage ratio

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - CONTRIBUTING.md
      - docs/design.md
